name: Harry Veille — AO publics

on:
  schedule:
    # 3h23 UTC = 5h23 Paris l'été, 4h23 l'hiver. Marge voulue : le cron GitHub peut
    # prendre plus de 2 h de retard, et la routine « Harry Veille — AO » lit
    # data/markets-latest.json à 9h40 Paris (7h40 UTC l'été).
    - cron: '23 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BOAMP scan
        env:
          # Le cockpit est désormais la seule sortie ; mettre '1' pour réactiver le mail.
          ENVOYER_MAIL: '0'
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ vars.RECIPIENTS }}
        run: python main.py

      - name: Commit market data for downstream consumers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/markets-latest.json
          git diff --cached --quiet || git commit -m "data: update markets $(date +%Y-%m-%d)"
          # Le cockpit peut pousser data/preferences.json pendant le job : on se rebase avant.
          git pull --rebase origin main
          git push

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boamp-report-${{ github.run_id }}
          path: reports/*.html
          retention-days: 90
